# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Django backend (this repo's `config/` project) as a web
# service, backed by a managed PostgreSQL database and a managed Key Value
# (Redis-compatible) cache. Does NOT deploy the Flutter app, the marketing
# website's own domain/CDN setup, or anything on the App Store/Play Store
# side — those are separate.
#
# One-time manual steps after the first Blueprint deploy: Render will prompt
# for every env var below marked `sync: false` (never committed here, since
# they're real secrets/config, not something to check into source control).
#   - DJANGO_ALLOWED_HOSTS: a custom domain, if any. The *.onrender.com
#     hostname is added automatically (see RENDER_EXTERNAL_HOSTNAME handling
#     in config/settings.py) — leave this blank until there's a custom domain.
#   - API_KEY: the shared secret the Flutter app sends as X-API-Key. Must not
#     be the dev placeholder ("dev-local-shared-key") — see config/settings.py.
#   - GOOGLE_PLACES_API_KEY: required for provider search to return anything.
#   - ANTHROPIC_API_KEY: optional — AI category classification and Ask AI's
#     chat fall back to plain keyword matching without it.
#   - CORS_ALLOWED_ORIGINS: only needed for a browser-based client (native
#     mobile ignores CORS entirely) — leave blank otherwise.
#   - DJANGO_SUPERUSER_USERNAME / _EMAIL / _PASSWORD: all optional, and all
#     three must be set together to do anything. If set, build.sh creates
#     that Django admin login on the next deploy (skipped if it already
#     exists) — see accounts/management/commands/create_superuser_from_env.py.
#     Leave all three blank to skip this and create an admin login some
#     other way (e.g. the Render shell).
#
# Known limits of the plans below, worth reading before relying on
# this for anything real:
#   - Postgres is on a paid plan (0.1c-256mb — Render's smallest paid tier,
#     same 256MB size as the free one), specifically so it does NOT expire
#     30 days after creation the way a free Postgres database does. This is
#     the one piece of this Blueprint meant to hold real data.
#   - Key Value: free instances don't persist to disk, so a restart empties
#     the cache (cached Google Places results, rate-limit counters) — not
#     data loss in the important sense, just cache misses right after.
#   - Web service: on the paid `starter` plan, so it stays running instead of
#     spinning down when idle. A Blueprint sync applies the plan written
#     here, so keep it in step with what the Render dashboard shows —
#     otherwise the next sync silently moves the service to the written plan.

databases:
  - name: toplinkai-db
    databaseName: toplinkai
    user: toplinkai
    plan: 0.1c-256mb
    # No external access — the web service below reaches this over Render's
    # private network via DATABASE_URL. Raise this only if something outside
    # Render (a local machine, another host) needs to connect directly.
    ipAllowList: []

services:
  - type: keyvalue
    name: toplinkai-redis
    plan: free
    ipAllowList: []
    # A cache (Google Places results, rate-limit counters), not a queue or
    # source of truth — safe to evict under memory pressure.
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: toplinkai-backend
    runtime: python
    plan: starter
    region: oregon
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    # A cheap, DB-free view (website.views.robots_txt) — see config/urls.py.
    healthCheckPath: /robots.txt
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Render terminates TLS and proxies to this service over HTTP,
      # forwarding X-Forwarded-Proto — see config/settings.py's comment on
      # SECURE_PROXY_SSL_HEADER for why this must never be set to True
      # anywhere that isn't actually behind a real proxy.
      - key: DJANGO_BEHIND_PROXY
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      # The Django admin's URL path (required with DEBUG off): long and random,
      # e.g. manage-<random letters>. Never "admin". See config/admin_path.py.
      - key: ADMIN_URL_PATH
        sync: false
      # Error monitoring: the Django project's DSN from sentry.io. Leave blank
      # to keep Sentry off. See config/sentry.py for what is scrubbed.
      - key: SENTRY_DSN
        sync: false
      - key: API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # All three optional — leave blank in the Render dashboard prompt to
      # skip creating an admin login this way. See the comment block above.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      # Shown on the website's Contact page and on the privacy, terms, provider-agreement and delete-account
      # pages (Google Play needs a working way to ask for account deletion). Set it before launch: until then
      # those pages show a visible "to be set" placeholder.
      - key: WEBSITE_CONTACT_EMAIL
        sync: false
      # Provider sign-in with Google (the providers app): the Web OAuth client ID
      # the app passes as GOOGLE_SERVER_CLIENT_ID, comma-separated if there are
      # several. Without it provider sign-in answers 503. Never set
      # GOOGLE_DEV_FAKE_AUTH here: the app refuses to start with it on outside DEBUG.
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      # Chat (the messaging app), all set in the Render dashboard, never committed. Push needs the
      # Firebase service-account JSON; photos need the four R2 values. Without them push / photos
      # are off and text chat still works (check with `python manage.py check_messaging_config`).
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Lead validation tooling (the leads app) — all optional, all set in the
      # Render dashboard, never committed. SMS_ENABLED defaults to off: "Send to
      # providers" then only creates the offers and shows messages to copy.
      - key: SMS_ENABLED
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Gmail SMTP with an app password. ADMIN_ALERT_EMAIL is where the
      # "no YES after 2 hours" alert and the daily summary go. EMAIL_HOST_USER
      # and EMAIL_HOST_PASSWORD together also turn on "Continue with email"
      # sign-in (accounts.email_login): without both, the app hides it.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      # The website's public address (https://..., no trailing slash), for links in emails. See the cron job.
      - key: SITE_URL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: toplinkai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: toplinkai-redis
          property: connectionString

  # Runs every 15 minutes (UTC, as all Render cron schedules are): reminds
  # providers who haven't replied after 30 minutes (only when SMS_ENABLED),
  # expires stale offers, emails when a request has no YES after 2 hours,
  # sends the daily summary once after 14:00 UTC, and sends seasonal reminders
  # to past clients (10:00-19:00 Edmonton time, when enabled). See leads/jobs.py. It needs
  # the same database and the same secrets as the web service, entered in this
  # service's own Environment tab (Render doesn't allow sync: false values in
  # shared environment groups). It never serves requests, so it gets its own
  # throwaway SECRET_KEY / API_KEY instead of the real API key.
  - type: cron
    name: toplinkai-lead-jobs
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_lead_jobs
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: API_KEY
        generateValue: true
      # Required by settings with DEBUG off; the cron job serves no pages, so any valid path does.
      - key: ADMIN_URL_PATH
        value: "not-served-by-cron"
      # Same DSN as the web service (optional), so a failing job is reported too.
      - key: SENTRY_DSN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: toplinkai-db
          property: connectionString
      # Chat photos of deleted accounts are removed from R2 by this job when an earlier delete could not
      # (see messaging.photo_queue). Same four values as the web service; without them nothing is removed here
      # (and `python manage.py purge_photo_queue` can be run from the web service's shell instead).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Same values as the web service. Without SMS_ENABLED=True no reminder is
      # texted; the alert email and daily summary work either way.
      - key: SMS_ENABLED
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Gmail SMTP with an app password. ADMIN_ALERT_EMAIL is where the
      # "no YES after 2 hours" alert and the daily summary go.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      # Seasonal reminders to past clients (growth.jobs): off until SEASONAL_REMINDERS_ENABLED=True. Push needs
      # the same FCM_SERVICE_ACCOUNT_JSON as the web service; email needs SITE_URL (the website's public
      # address, for the request and unsubscribe links) and BUSINESS_MAILING_ADDRESS (CASL requires a mailing
      # address in every commercial email). SEASONAL_REMINDERS_DAILY_CAP defaults to 150 a day.
      - key: SEASONAL_REMINDERS_ENABLED
        sync: false
      - key: SEASONAL_REMINDERS_DAILY_CAP
        sync: false
      - key: SITE_URL
        sync: false
      - key: BUSINESS_MAILING_ADDRESS
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
