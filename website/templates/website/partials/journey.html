{% load website_tags %}
<ol class="journey">
  {% for name, text, ic in journey_steps %}
  <li>
    <span class="icon-tile">{% icon ic %}</span>
    <span class="step-tag">Step {{ forloop.counter }}</span>
    <strong>{{ name }}</strong>
    <span class="step-text">{{ text }}</span>
  </li>
  {% endfor %}
</ol>
