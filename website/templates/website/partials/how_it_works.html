{% load website_tags %}
<ol class="steps">
  {% for title, text, ic in how_it_works %}
  <li>
    <div class="step-head"><span class="icon-tile icon-tile-lg">{% icon ic %}</span><span class="step-tag">Step {{ forloop.counter }}</span></div>
    <h3>{{ title }}</h3>
    <p>{{ text }}</p>
  </li>
  {% endfor %}
</ol>
